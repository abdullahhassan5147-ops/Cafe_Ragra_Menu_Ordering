<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeRagra - Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">CafeRagra</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="page-banner">
        <p class="small-title">CAFErAGRA GALLERY</p>
        <h1>Our Gallery</h1>
        <p>A few pictures from our cafe and coffee collection.</p>
    </section>

    <section class="gallery-section">
        <div class="gallery-grid">

            <div class="gallery-item">
                <img src="image.webp" alt="Coffee beans and cups">
                <div class="gallery-caption">Fresh Coffee Beans</div>
            </div>

            <div class="gallery-item">
                <img src="espresso.svg" alt="Espresso">
                <div class="gallery-caption">Fresh Espresso</div>
            </div>

            <div class="gallery-item">
                <img src="latte.svg" alt="Latte">
                <div class="gallery-caption">Creamy Latte</div>
            </div>

            <div class="gallery-item">
                <img src="cappuccino.svg" alt="Cappuccino">
                <div class="gallery-caption">Classic Cappuccino</div>
            </div>

            <div class="gallery-item">
                <img src="iced-mocha.svg" alt="Iced Mocha">
                <div class="gallery-caption">Iced Mocha</div>
            </div>

            <div class="gallery-item">
                <img src="chocolate.svg" alt="Hot Chocolate">
                <div class="gallery-caption">Hot Chocolate</div>
            </div>

        </div>
    </section>
</main>

<footer>
    <p>© 2026 CafeRagra | Abdullah Hassan | SE-C</p>
</footer>

</body>
</html>
